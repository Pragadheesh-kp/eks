name: Deploy to Kubernetes

on:
  workflow_dispatch: # Allows manual triggering of the workflow
    inputs:
      frontend_image_version:
        description: 'The version of the Frontend Docker image to deploy'
        required: true
        default: '1.0'
      backend_image_version:
        description: 'The version of the Backend Docker image to deploy'
        required: true
        default: '1.0'

jobs:
  deploy:
    name: Deploy to Kubernetes
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Code
      uses: actions/checkout@v3

    - name: Configure AWS Credentials
      run: |
        aws configure set aws_access_key_id ${{ secrets.AWS_ACCESS_KEY_ID }}
        aws configure set aws_secret_access_key ${{ secrets.AWS_SECRET_ACCESS_KEY }}
        aws configure set region ap-south-1

    - name: Update kubeconfig for EKS
      id: update_kubeconfig
      run: |
        aws eks update-kubeconfig --region ap-south-1 --name task7 

    - name: Update Frontend Image Version
      run: |
        sed -i "s/241533159425.dkr.ecr.ap-south-1.amazonaws.com\/frontend:[0-9]\+/241533159425.dkr.ecr.ap-south-1.amazonaws.com\/frontend:${{ github.event.inputs.frontend_image_version }}/" frontend/frontend.yml
        yamllint frontend/frontend.yml

    - name: Apply Frontend Manifest
      run: |
        kubectl apply -f frontend/frontend.yml

    - name: Update Backend Image Version
      run: |
        sed -i "s/241533159425.dkr.ecr.ap-south-1.amazonaws.com\/backend:[0-9]\+/241533159425.dkr.ecr.ap-south-1.amazonaws.com\/backend:${{ github.event.inputs.backend_image_version }}/" backend/backend.yml
        yamllint backend/backend.yml

    - name: Apply Backend Manifest
      run: |
        kubectl apply -f backend/backend.yml
